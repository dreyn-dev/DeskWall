<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeskWall Wallpaper</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0f4c6e; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #icons { position: fixed; inset: 0; pointer-events: none; }
      .demo-icon { position: absolute; pointer-events: auto; cursor: grab; display: flex; flex-direction: column;
        align-items: center; gap: 6px; padding-top: 8px; box-sizing: border-box; border-radius: 4px;
        font: 12px/1.2 "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #fff;
        text-shadow: 0 1px 2px rgb(0 0 0 / 0.7); user-select: none; touch-action: none; }
      .demo-icon:hover { background: rgb(255 255 255 / 0.14); }
      .demo-icon.dragging { cursor: grabbing; background: rgb(255 255 255 / 0.22); }
      .demo-icon i { width: 44px; height: 44px; border-radius: 10px; background: linear-gradient(145deg, #fff8, #fff3);
        box-shadow: 0 2px 6px rgb(0 0 0 / 0.25); }
      #hud { position: fixed; right: 12px; bottom: 12px; font: 11px system-ui, sans-serif; color: #fffc;
        background: rgb(0 0 0 / 0.35); padding: 4px 8px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="icons"></div>
    <script type="module" src="/src/wallpaper/main.ts"></script>
  </body>
</html>
