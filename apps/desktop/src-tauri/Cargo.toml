[package]
name = "deskwall"
version = "0.1.0"
description = "DeskWall: a living wallpaper that grows around your desktop icons"
authors = ["DeskWall contributors"]
license = "GPL-3.0-only"
repository = "https://github.com/dreyn-dev/DeskWall"
edition = "2024"
rust-version = "1.88"

[lib]
name = "deskwall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-store = "2.5.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-log = "2.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
log = "0.4.35"
sys-locale = "0.3.2"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Variant",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
