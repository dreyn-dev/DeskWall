name: Audit

# Known vulnerabilities in the Rust host's dependencies (RustSec advisory database).
# On every change to Cargo.lock and weekly, because new advisories appear without code changes.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/src-tauri/Cargo.lock', '.github/workflows/audit.yml']
  pull_request:
    paths: ['apps/desktop/src-tauri/Cargo.lock', '.github/workflows/audit.yml']
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        working-directory: apps/desktop/src-tauri
        run: cargo audit
