name: Pages

on:
  push:
    branches: [main]
    paths: [site/**, apps/desktop/public/themes/classic/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Copy live theme pages into the site
        run: |
          mkdir -p site/theme
          cd apps/desktop/public/themes/classic
          cp -r kit.js assets mycelium.* ripples.* isolines.* watercolor.* stars.* thaw.* ../../../../../site/theme/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
